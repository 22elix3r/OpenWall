name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers libegl-mesa0 libgl1-mesa-dri libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-gl sway grim ffmpeg python3-pil qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-wayland qml-qt6 qml6-module-qtwayland-compositor qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: macOS desktop dependencies
        if: runner.os == 'macOS'
        run: |
          brew install qt
          echo "QMAKE=$(brew --prefix qt)/bin/qmake" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-rust-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-rust-v2-
      - run: cargo fmt --all --check
      - name: Integration probe syntax
        run: |
          python3 -m py_compile scripts/test_wayland_headless.py scripts/test_plasma_bridge.py scripts/test_gnome_headless.py scripts/benchmark_video.py scripts/test_video_transfer_probe.py scripts/test_video_color.py
          node --input-type=module --check < integrations/gnome/presentation.js
      - name: Measurement harness process tests
        run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: GPU conformance using software Vulkan
        if: runner.os == 'Linux'
        env:
          OPENWALL_TEST_GPU: '1'
        run: cargo test --locked -p openwall --test cli gpu_ -- --nocapture
      - name: Headless Wayland lifecycle and video
        if: runner.os == 'Linux'
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -t 2 -an -c:v libvpx-vp9 -b:v 400k /tmp/openwall-loop.webm
          /usr/bin/python3 scripts/test_wayland_headless.py --software-vulkan --video-fixture /tmp/openwall-loop.webm
      - name: External-process Plasma presentation bridge
        if: runner.os == 'Linux'
        run: /usr/bin/python3 scripts/test_plasma_bridge.py --video-fixture /tmp/openwall-loop.webm
      - name: Windowless video transfer probe
        if: runner.os == 'Linux'
        run: |
          cargo test -p openwall --example video_transfer_probe --locked
          cargo build -p openwall --example video_transfer_probe --locked
          /usr/bin/python3 scripts/test_video_transfer_probe.py --software-gl --video-fixture /tmp/openwall-loop.webm
      - name: SDR video conversion regressions
        if: runner.os == 'Linux'
        run: /usr/bin/python3 scripts/test_video_color.py --software-gl
      - name: GUI startup
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
        run: python3 -c 'import subprocess; subprocess.run(["target/debug/openwall-ui", "--check"], timeout=30, check=True)'
