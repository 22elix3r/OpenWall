name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Keep Ubuntu's signed archive/keyring; avoid the slow Azure HTTP mirror.
          for openwall_apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt; do
            if [ -f "$openwall_apt_source" ]; then
              sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' "$openwall_apt_source"
            fi
          done
          openwall_apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          sudo apt-get "${openwall_apt_options[@]}" update
          sudo apt-get "${openwall_apt_options[@]}" install -y clang lld pkg-config libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers libegl-mesa0 libgl1-mesa-dri libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-gl sway grim ffmpeg python3-pil qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-wayland qml-qt6 qml6-module-qtwayland-compositor qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: macOS desktop dependencies
        if: runner.os == 'macOS'
        run: |
          brew install qt
          echo "QMAKE=$(brew --prefix qt)/bin/qmake" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-rust-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-rust-v2-
      - run: cargo fmt --all --check
      - name: Integration probe syntax
        run: |
          python3 -m py_compile scripts/test_wayland_headless.py scripts/test_plasma_bridge.py scripts/test_gnome_headless.py scripts/benchmark_video.py scripts/benchmark_native_gl_video.py scripts/test_video_transfer_probe.py scripts/video_color_fixtures.py scripts/private_gpu.py scripts/test_video_color.py scripts/test_owned_gl_sequence.py scripts/test_owned_egl_wayland.py scripts/test_shared_egl_session.py scripts/test_staged_egl.py scripts/test_nested_egl.py scripts/test_nvidia_gl_interop.py scripts/test_native_gl_video.py scripts/test_shared_video_outputs.py scripts/test_video_replacement.py scripts/build_wayland_runtime.py scripts/test_wayland_runtime.py
          node --input-type=module --check < integrations/gnome/presentation.js
      - name: Integration harness process tests
        run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Optional shared-GL probe compile checks
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p openwall --lib --no-default-features --features native-egl --locked -- -D warnings
          cargo clippy -p openwall --examples --features video-gl-probe --locked -- -D warnings
      - run: cargo build --workspace --locked
      - name: Save compiled dependencies before native integration tests
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-rust-v2-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --workspace --locked
      - name: App-local GStreamer 1.28 Wayland helper
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt-get install -y meson ninja-build patch wayland-protocols libdrm-dev
          python3 scripts/test_wayland_runtime.py
          # Regenerate this CI artifact instead of restoring native code from an older source patch.
          rm -rf target/debug/openwall-runtime
          python3 scripts/build_wayland_runtime.py
          python3 scripts/test_wayland_runtime.py --expect-bundled
      - name: GPU conformance using software Vulkan
        if: runner.os == 'Linux'
        env:
          OPENWALL_TEST_GPU: '1'
        run: cargo test --locked -p openwall --test cli gpu_ -- --nocapture
      - name: Headless Wayland lifecycle and video
        if: runner.os == 'Linux'
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -t 2 -an -c:v libvpx-vp9 -b:v 400k /tmp/openwall-loop.webm
          /usr/bin/python3 scripts/test_wayland_headless.py --software-vulkan --video-fixture /tmp/openwall-loop.webm
      - name: External-process Plasma presentation bridge
        if: runner.os == 'Linux'
        run: /usr/bin/python3 scripts/test_plasma_bridge.py --video-fixture /tmp/openwall-loop.webm
      - name: Windowless video transfer probe
        if: runner.os == 'Linux'
        run: |
          cargo test -p openwall --example video_transfer_probe --locked
          cargo build -p openwall --example video_transfer_probe --locked
          /usr/bin/python3 scripts/test_video_transfer_probe.py --software-gl --video-fixture /tmp/openwall-loop.webm
      - name: SDR video conversion regressions
        if: runner.os == 'Linux'
        run: /usr/bin/python3 scripts/test_video_color.py --software-gl
      - name: Owned GL shared-texture color and boundary checks
        if: matrix.os == 'ubuntu-26.04'
        run: |
          cargo build -p openwall --example owned_gl_video_probe --features video-gl-probe --locked
          /usr/bin/python3 scripts/test_video_color.py --software-gl --owned-gl-binary target/debug/examples/owned_gl_video_probe
          /usr/bin/python3 scripts/test_owned_gl_sequence.py
          /usr/bin/python3 scripts/test_video_color.py --software-gl --owned-gl-binary target/debug/examples/owned_gl_video_probe --owned-gl-api desktop
          /usr/bin/python3 scripts/test_owned_gl_sequence.py --gl-api desktop
      - name: Shared video textures on an owned native Wayland surface
        if: matrix.os == 'ubuntu-26.04'
        run: |
          cargo build -p openwall --example native_gl_video_probe --features video-gl-probe --locked
          /usr/bin/python3 scripts/test_native_gl_video.py
          /usr/bin/python3 scripts/test_native_gl_video.py --gl-api gles
          /usr/bin/python3 scripts/test_native_gl_video.py --staged --hold-seconds 11
          /usr/bin/python3 scripts/test_native_gl_video.py --staged --gl-api gles
          /usr/bin/python3 scripts/benchmark_native_gl_video.py /tmp/openwall-loop.webm --binary target/debug/examples/native_gl_video_probe --width 640 --height 360 --seconds 3 --warmup 0 --repeat 1 --check-interruption
          /usr/bin/python3 scripts/benchmark_native_gl_video.py /tmp/openwall-loop.webm --binary target/debug/examples/native_gl_video_probe --width 640 --height 360 --seconds 3 --warmup 0 --repeat 1 --gl-api gles --check-interruption
      - name: One decoder survives its first private video output
        if: matrix.os == 'ubuntu-26.04'
        run: |
          cargo build -p openwall --example shared_video_outputs_probe --features video-gl-probe --locked
          /usr/bin/python3 scripts/test_shared_video_outputs.py
          /usr/bin/python3 scripts/test_shared_video_outputs.py --gl-api gles
      - name: Older GL runtime rejection
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cargo build -p openwall --example owned_gl_video_probe --features video-gl-probe --locked
          /usr/bin/python3 - <<'PY'
          import os, subprocess
          result = subprocess.run(["target/debug/examples/owned_gl_video_probe", "/tmp/openwall-loop.webm",
                                   "--first-frame", "/tmp/openwall-old-gl.png"],
                                  env=dict(os.environ, GST_GL_WINDOW="surfaceless"),
                                  capture_output=True, text=True, timeout=10)
          assert result.returncode != 0 and "requires GStreamer 1.26 or newer" in result.stderr, result
          assert not result.stdout.strip() and not os.path.exists("/tmp/openwall-old-gl.png"), result
          PY
          cargo build -p openwall --example native_gl_video_probe --features video-gl-probe --locked
          /usr/bin/python3 - <<'PY'
          import os, subprocess
          result = subprocess.run(["target/debug/examples/native_gl_video_probe", "/tmp/openwall-loop.webm", "--output", "never-connect"],
                                  env=dict(os.environ, OPENWALL_PRIVATE_COMPOSITOR="1"),
                                  capture_output=True, text=True, timeout=10)
          assert result.returncode != 0 and "requires GStreamer 1.26 or newer" in result.stderr, result
          assert not result.stdout.strip(), result
          PY
          cargo build -p openwall --example video_replacement_probe --features video-gl-probe --locked
          /usr/bin/python3 - <<'PY'
          import os, subprocess
          result = subprocess.run(["target/debug/examples/video_replacement_probe", "/tmp/openwall-loop.webm",
                                   "/tmp/openwall-loop.webm", "--output", "never-connect", "--control-socket", "/never-created.sock"],
                                  env=dict(os.environ, OPENWALL_PRIVATE_COMPOSITOR="1"),
                                  capture_output=True, text=True, timeout=10)
          assert result.returncode != 0 and "video replacement requires GStreamer 1.26 or newer" in result.stderr, result
          assert not result.stdout.strip() and not os.path.exists("/never-created.sock"), result
          PY
          cargo build -p openwall --example shared_video_outputs_probe --features video-gl-probe --locked
          /usr/bin/python3 - <<'PY'
          import os, subprocess
          result = subprocess.run(["target/debug/examples/shared_video_outputs_probe", "/tmp/openwall-loop.webm",
                                   "--first", "never-first", "--second", "never-second"],
                                  env=dict(os.environ, OPENWALL_PRIVATE_COMPOSITOR="1"),
                                  capture_output=True, text=True, timeout=10)
          assert result.returncode != 0 and "shared video outputs require GStreamer 1.26 or newer" in result.stderr, result
          assert not result.stdout.strip(), result
          PY
      - name: Owned EGL Wayland surface and click-through
        if: runner.os == 'Linux'
        run: |
          cargo build -p openwall --example owned_egl_wayland_probe --features video-gl-probe --locked
          /usr/bin/python3 scripts/test_owned_egl_wayland.py
          /usr/bin/python3 scripts/test_owned_egl_wayland.py --gl-api desktop
      - name: Shared EGL session survives private output removal
        if: runner.os == 'Linux'
        run: |
          cargo build -p openwall --example shared_egl_session_probe --features video-gl-probe --locked
          /usr/bin/python3 scripts/test_shared_egl_session.py
          /usr/bin/python3 scripts/test_shared_egl_session.py --gl-api gles
      - name: Synchronized EGL child publication
        if: runner.os == 'Linux'
        run: |
          cargo build -p openwall --example staged_egl_subsurface_probe --features video-gl-probe --locked
          /usr/bin/python3 scripts/test_staged_egl.py
          /usr/bin/python3 scripts/test_staged_egl.py --gl-api gles
      - name: Replace and restore content under one persistent desktop root
        if: runner.os == 'Linux'
        run: |
          cargo build -p openwall --example nested_egl_publication_probe --features video-gl-probe --locked
          /usr/bin/python3 scripts/test_nested_egl.py
          /usr/bin/python3 scripts/test_nested_egl.py --gl-api gles
      - name: Distinct video replacement and rollback
        if: matrix.os == 'ubuntu-26.04'
        run: |
          cargo build -p openwall --example video_replacement_probe --features video-gl-probe --locked
          /usr/bin/python3 scripts/test_video_replacement.py
          /usr/bin/python3 scripts/test_video_replacement.py --gl-api gles
      - name: GUI startup
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
        run: python3 -c 'import subprocess; subprocess.run(["target/debug/openwall-ui", "--check"], timeout=30, check=True)'
