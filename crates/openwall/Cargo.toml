[package]
name = "openwall"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Open-source desktop wallpapers and Wallpaper Engine compatibility tools"

[features]
default = ["video"]
video = ["dep:gstreamer", "dep:gstreamer-video", "dep:libloading"]
native-egl = ["dep:khronos-egl", "dep:glow", "dep:wayland-egl"]
video-gl-probe = ["video", "native-egl", "dep:gstreamer-app", "dep:gstreamer-gl", "dep:gstreamer-gl-egl"]

[dependencies]
openwall-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
clap = { version = "4", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl"] }
winit = "0.30"
pollster = "1.0"
bytemuck = { version = "1", features = ["derive"] }
ctrlc = "3"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["event", "fs", "time", "net", "process"] }
gstreamer = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
libloading = { version = "0.9", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-gl = { version = "0.25", optional = true }
gstreamer-gl-egl = { version = "0.25", optional = true, features = ["v1_24"] }
khronos-egl = { version = "6", optional = true, features = ["dynamic"] }
glow = { version = "0.18", optional = true }
wayland-egl = { version = "0.32.11", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSScreen"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindowLevel"] }
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-media", "objc2-quartz-core", "AVPlayer", "AVPlayerItem", "AVPlayerLayer", "AVPlayerLooper", "AVAnimation", "AVError"] }

[dev-dependencies]
tempfile = "3"
